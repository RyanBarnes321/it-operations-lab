name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate source and reachable history
        run: |
          python -m pip install -r requirements-quality.txt
          python scripts/check-source.py
          docker compose config -q
      - name: Start disposable runner stack
        run: |
          umask 077
          mkdir -m 700 secrets
          openssl rand -hex 32 > secrets/grafana_admin_password
          openssl rand -hex 32 > secrets/grafana_secret_key
          chmod 444 secrets/*
          docker compose up -d
          # Newly started containers may reset established connections during startup.
          # Poll for readiness instead of treating the first reset as a permanent failure.
          wait_ready() {
            local label="$1" url="$2"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --max-time 5 "$url" >/dev/null 2>&1; then
                echo "$label ready (attempt $attempt)"
                return 0
              fi
              sleep 2
            done
            echo "::error::$label did not become ready within 120 seconds"
            docker compose ps
            docker compose logs --no-color --tail=100 grafana prometheus
            return 1
          }
          wait_ready Grafana http://127.0.0.1:3000/api/health
          wait_ready Prometheus http://127.0.0.1:9090/-/ready
      - name: Run existing validation suite
        run: ./scripts/validate.sh
      - name: Remove disposable runner stack
        if: always()
        run: docker compose down --volumes
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run isolated PowerShell endpoint cases
        shell: pwsh
        run: ./tests/Verify-Windows.ps1 -EvidencePath "$env:RUNNER_TEMP/windows-verification.json"
